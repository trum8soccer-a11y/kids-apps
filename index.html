<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>みんなの あそびば</title>
  <!-- アプリ化（PWA）・アイコン設定用の3行 -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #FFFDF5;
      --bg-bottom: #FEF3C7;
      --text-main: #431407;
      --text-sub: #78350F;
      --shadow-soft: 0 8px 0 rgba(120, 53, 15, 0.12), 0 12px 24px rgba(120, 53, 15, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Zen Maru Gothic', sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景のふんわり水玉 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(#FDE68A 2.5px, transparent 2.5px),
        radial-gradient(#FBCFE8 2.5px, transparent 2.5px);
      background-size: 48px 48px;
      background-position: 0 0, 24px 24px;
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 780px;
      position: relative;
      z-index: 1;
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }

    .sound-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: #FFFFFF;
      border: 3px solid #FDBA74;
      border-radius: 999px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 4px 0 #FDBA74;
      transition: transform 0.1s;
    }

    .sound-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #FDBA74;
    }

    .badge {
      display: inline-block;
      background: #FF8C42;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      box-shadow: 0 4px 0 #D96B27;
      margin-bottom: 12px;
    }

      margin: 0;
      font-size:
